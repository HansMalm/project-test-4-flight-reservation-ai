spring.application.name=flight-reservation-backend
app.cors.allowed-origins=http://localhost:5173
spring.datasource.url=jdbc:postgresql://localhost:5432/flightreservation
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=${GROQ_MODEL:qwen/qwen3.8-27b}
spring.ai.openai.chat.options.max-tokens=1000
spring.ai.openai.chat.extra-body.reasoning_effort=none
